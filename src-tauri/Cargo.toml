[package]
name = "orchard"
version = "0.2.1"
description = "Run coding agents in parallel git worktrees"
license = "MIT"
repository = "https://github.com/rodpru/orchard"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orchard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.8.3"
dirs = "7.0.0"
thiserror = "2.0.21"
shell-words = "1.1.1"
libc = "0.2.191"
tokio = { version = "1.54.0", features = ["process", "sync", "time", "rt"] }
futures-util = "0.3.34"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tauri-plugin-clipboard-manager = "2.5.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
