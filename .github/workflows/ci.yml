name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

  rust-platform:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend build output to exist.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      # --locked: a Cargo.toml change without its Cargo.lock update fails here,
      # instead of every build resolving the new crates afresh.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Fails when the Rust IPC types changed but src/lib/bindings was not regenerated.
      - run: git diff --exit-code -- ../src/lib/bindings

  # The "Protect main" ruleset requires a check named "rust"; the matrix jobs
  # report as "rust (<os>)", so this job reports their combined result.
  rust:
    needs: rust-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rust-platform.result }}" = success
