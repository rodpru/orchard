name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test

  rust-platform:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs the frontend build output to exist.
      - run: mkdir -p ../dist
      - run: cargo fmt --check
      # --locked: a Cargo.toml change without its Cargo.lock update fails here,
      # instead of every build resolving the new crates afresh.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Fails when the Rust IPC types changed but src/lib/bindings was not regenerated.
      - run: git diff --exit-code -- ../src/lib/bindings

  # The "Protect main" ruleset requires a check named "rust"; the matrix jobs
  # report as "rust (<os>)", so this job reports their combined result.
  rust:
    needs: rust-platform
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.rust-platform.result }}" = success
