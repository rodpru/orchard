name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The platform jobs upload into this release, so neither races to create it.
  # It stays a draft until every asset is up: "latest" never points at a
  # release that is still building or whose build failed.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # latest.json takes its version from the tag and the signature from
      # tauri.conf.json; if they differ, no client accepts the update.
      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$tag" != "$conf" ] || [ "$tag" != "$crate" ]; then
            echo "::error::tag $tag, tauri.conf.json $conf, Cargo.toml $crate"
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run unpublishes the existing release first, so clients never
          # fetch its old latest.json while new assets are uploaded.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=true
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
          fi

  macos:
    needs: release
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Universal build: one .dmg for Apple Silicon and Intel, so the cask needs a single url.
      # The release config makes the updater archive, which the CLI only does
      # with a key at hand. A throwaway one keeps the real key away from the
      # build and its dependencies; the `sign` job signs the archive for real.
      - shell: bash
        run: |
          pnpm exec tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            pnpm exec tauri build --target universal-apple-darwin --config src-tauri/tauri.release.conf.json -- --locked
      - name: Upload the .dmg and the updater archive to the GitHub Release
        id: dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          dmg=$(ls "$bundle"/dmg/*.dmg)
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          cp "$bundle/macos/Orchard.app.tar.gz" Orchard_universal.app.tar.gz
          gh release upload "$GITHUB_REF_NAME" "$dmg" Orchard_universal.app.tar.gz --clobber

  linux:
    needs: release
    # The oldest supported runner, so the .deb links against an older glibc
    # and installs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # A throwaway key, as on macOS.
      - shell: bash
        run: |
          pnpm exec tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            pnpm exec tauri build --config src-tauri/tauri.release.conf.json -- --locked
      # A fixed asset name, so releases/latest/download/orchard_amd64.deb always
      # points at the newest version.
      - name: Upload the .deb to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
          cp "$deb" orchard_amd64.deb
          gh release upload "$GITHUB_REF_NAME" orchard_amd64.deb --clobber

  # The only job that sees the signing key. It builds nothing and installs
  # nothing from the project: it signs the updater files the build jobs
  # uploaded, and checks each signature against the app's public key, since
  # no client accepts an update signed by another key.
  sign:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    environment: release
    outputs:
      macos: ${{ steps.sign.outputs.macos }}
      linux: ${{ steps.sign.outputs.linux }}
    steps:
      # Only the config with the public key; no package.json or .npmrc.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the updater files from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern Orchard_universal.app.tar.gz --pattern orchard_amd64.deb
      # `requireSignedVersion` in tauri.conf.json makes clients reject a
      # signature without the version, so it is bound to the tag's.
      - name: Sign them
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for file in Orchard_universal.app.tar.gz orchard_amd64.deb; do
            npx --yes @tauri-apps/cli@2.12.3 signer sign --app-version "${GITHUB_REF_NAME#v}" "$file"
          done
      - name: Check the signatures against the app's public key
        id: sign
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          pubkey=$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json | base64 -d | tail -1)
          for file in Orchard_universal.app.tar.gz orchard_amd64.deb; do
            base64 -d < "$file.sig" > "$file.minisig"
            minisign -Vm "$file" -x "$file.minisig" -P "$pubkey"
          done
          echo "macos=$(cat Orchard_universal.app.tar.gz.sig)" >> "$GITHUB_OUTPUT"
          echo "linux=$(cat orchard_amd64.deb.sig)" >> "$GITHUB_OUTPUT"

  # The manifest goes up last and the draft is published after it, so the
  # updater never sees a manifest whose files are missing. The cask is pointed
  # at the release only once it is public.
  publish:
    needs: [macos, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Upload latest.json and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNATURE: ${{ needs.sign.outputs.macos }}
          LINUX_SIGNATURE: ${{ needs.sign.outputs.linux }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # The universal archive serves both Mac architectures.
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/Orchard_universal.app.tar.gz" \
            --arg mac_sig "$MACOS_SIGNATURE" \
            --arg deb_url "$base/orchard_amd64.deb" \
            --arg deb_sig "$LINUX_SIGNATURE" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "darwin-x86_64": {url: $mac_url, signature: $mac_sig},
              "linux-x86_64-deb": {url: $deb_url, signature: $deb_sig}
            }}' > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rodpru/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Point the cask at the new release
        working-directory: homebrew-tap
        env:
          SHA256: ${{ needs.macos.outputs.sha256 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/orchard.rb
          # A re-run of the same tag leaves the cask unchanged.
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "orchard $version"
          git push
